[pytest]
addopts =
    -q
testpaths =
    test_verify_project.py
    test_interface_diagnostics.py
    test_interface_diagnostic_flow.py
norecursedirs =
    .venv
    venv
    __pycache__
    .git
    .pytest_cache
    _legacy_document_engine
    _backups
    node_modules
markers =
    slow: tests longs
    integration: tests necessitant Ollama/API
